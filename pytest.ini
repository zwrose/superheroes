[pytest]
# Pin rootdir to the repo root so repo-root conftest.py and source_guard.py
# load for every invocation shape (including cwd inside a nested test directory).

# Markers registered for the test suite.
markers =
    proc_containment: asserts on processes by pid through /proc; skips in the claude write sandbox, and a skip anywhere else on Linux is a failure
    process_listing: lists processes with ps (a process group or the process table); skips only in the claude write sandbox when the ps probe fails there, and a skip anywhere else is a failure
