<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review sheet</title>
<link rel="stylesheet" href="comic-panel.css">
<style>
  body { background: var(--sh-paper); margin: 0; }
  .sh-theme { padding-block: 16px 40px; padding-inline: 16px; }
  .sheet-page { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); margin-inline: auto; max-width: 720px; overflow-wrap: anywhere; }
  .sheet-page .sh-appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 1; }
  .sheet-page .sh-appbar { flex-wrap: wrap; }
  .sheet-page main { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
  .sheet-layout { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
  .sheet-main, .sheet-side { align-content: start; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  .sheet-page .sheet-stepper { align-items: center; display: flex; flex-wrap: wrap; gap: 8px; }
  .sheet-page .sheet-stepper .sh-label { flex: 1 1 auto; margin: 0; }
  .sheet-page .sheet-list { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
  .sheet-page .sheet-row, .sheet-page .sheet-fold { align-items: center; display: flex; gap: 8px; max-width: 100%; text-align: left; }
  .sheet-page .sheet-row { justify-content: space-between; }
  .sheet-page .sheet-fold { flex-wrap: wrap; }
  .sheet-page .sheet-row-text { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet-page .sheet-row.is-current, .sheet-page .sheet-row.is-folded { display: none; }
  .sheet-page .sheet-list.is-expanded .sheet-row.is-folded { display: flex; }
  .sheet-page .sheet-footer { align-items: center; display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .sheet-page :is(h2, p, ul, blockquote) { margin: 0; }
  .sheet-page :is(.sh-card, .sh-box) > * + * { margin-top: 8px; }
  .sheet-page .sh-card > h2 { font-size: 22px; margin-top: 12px; }
  .sheet-page .sh-card > .sh-label { margin-top: 16px; }
  .sheet-page .sh-card > .sh-label + * { margin-top: 4px; }
  .sheet-page .sh-box h2 { font-size: 22px; }
  .sheet-page .sh-box ul { padding-left: 20px; }
  .sheet-page .sh-card > label.sh-label { display: block; }
  .sheet-page .sh-card ul { padding-left: 20px; }
  .sheet-page .sheet-consequence { display: block; }
  .sheet-page .sheet-recommendation > * + * { margin-top: 4px; }
  .sheet-page .sheet-images { display: grid; gap: 12px; }
  .sheet-page .sheet-figure { margin: 0; }
  .sheet-page .sheet-figure img { display: block; height: auto; max-width: 100%; }
  .sheet-page .sheet-figure figcaption { margin-top: 4px; }
  .sheet-page .answer-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .sheet-page .answer-row .sh-button { max-width: 100%; padding-block: 8px; text-align: center; white-space: normal; }
  .sheet-page .save-line, .sheet-page .sheet-gate, .sheet-page .send-row { align-items: center; display: flex; flex-wrap: wrap; gap: 8px; }
  .sheet-page #sheet-final > * + * { margin-top: 16px; }
  .sheet-page :is(.sh-button, .sh-field):disabled { cursor: not-allowed; opacity: 0.5; }
  @media (min-width: 900px) {
    .sheet-page { max-width: 1200px; }
    .sheet-layout { grid-template-columns: 340px minmax(0, 1fr); }
    .sheet-side { grid-column: 1; grid-row: 1; }
    .sheet-main { grid-column: 2; grid-row: 1; }
    .sheet-page .sheet-row.is-current, .sheet-page .sheet-row.is-folded { display: flex; }
    .sheet-page .sheet-fold { display: none; }
  }
  .sh-theme [hidden] { display: none; }
</style>

<div class="sh-theme">
  <div class="sheet-page">
    <header class="sh-appbar">
      <span class="sh-appbar__name" id="sheet-title">Review sheet</span>
      <span id="sheet-count" hidden></span>
    </header>
    <p id="sheet-status" class="sh-caption">Loading the sheet…</p>
    <p id="sheet-gate" class="sh-caption sheet-gate" hidden></p>
    <div id="sheet-error" class="sh-box" role="alert" hidden>
      <h2>This sheet can't be shown</h2>
      <ul id="sheet-error-list"></ul>
    </div>
    <div id="sheet-history" class="sh-box" hidden></div>
    <div class="sheet-layout">
      <div class="sheet-main">
        <div id="sheet-stepper" class="sheet-stepper" hidden></div>
        <main id="sheet-cards"></main>
        <div id="sheet-footer" class="sheet-footer" hidden></div>
      </div>
      <div class="sheet-side">
        <div id="sheet-why" class="sh-box" hidden></div>
        <div id="sheet-items" class="sheet-list" role="group" aria-label="Items" hidden></div>
      </div>
    </div>
    <div id="sheet-final" hidden></div>
    <div id="sheet-done" class="sh-box" hidden></div>
  </div>
</div>

<script id="sheet-check">
  // sheet.schema.json is the only home of a sheet's shape: the page fetches it and checks the data
  // file against it with the small reader below. READ_RULES lists the keywords the reader enforces
  // and ANNOTATIONS the ones that carry no rule. A schema that uses any other keyword ($id included,
  // since every $ref is read from the root and no reference scope is honoured), or one of
  // these in a form the reader does not implement, is refused whole before any sheet is checked, so
  // a sheet is never drawn against a rule this page cannot check. The rest is authored here
  // because a schema cannot express it: unique card ids, unique option ids within a card,
  // unsettled ids that name real cards, and a recommendation that names one of its card's options.
  const READ_RULES = [
    "type", "const", "enum", "minLength", "minimum", "minItems", "uniqueItems", "pattern", "required",
    "properties", "additionalProperties", "items", "$ref", "allOf", "if", "then", "not", "anyOf",
  ];
  const ANNOTATIONS = [
    "$schema", "title", "description", "$comment", "examples", "default", "$defs", "definitions",
  ];

  // Two values are equal when they hold the same data, whatever order an object's keys came in.
  function canonical(value) {
    if (Array.isArray(value)) return "[" + value.map(canonical).join(",") + "]";
    if (value !== null && typeof value === "object") {
      return "{" + Object.keys(value).sort().map((key) => JSON.stringify(key) + ":" + canonical(value[key])).join(",") + "}";
    }
    return JSON.stringify(value);
  }

  // Follows a "#/a/b" pointer from the schema's root. Returns { target } or { problem }.
  function resolvePointer(root, ref) {
    if (typeof ref !== "string" || !ref.startsWith("#/")) {
      return { problem: "it must be a string that starts with #/" };
    }
    let target = root;
    for (const key of ref.slice(2).split("/")) {
      if (key.includes("~") || key.includes("%")) {
        return { problem: "it uses an escape this page does not follow" };
      }
      const steppable = Array.isArray(target) ? /^(0|[1-9][0-9]*)$/.test(key) : target !== null && typeof target === "object";
      if (!steppable || !Object.prototype.hasOwnProperty.call(target, key)) {
        return { problem: "it does not lead anywhere in the schema" };
      }
      target = target[key];
    }
    if (target === undefined) {
      return { problem: "it does not lead anywhere in the schema" };
    }
    return { target: target };
  }

  // Lists every place the schema uses a rule, or a form of a rule, that validateAgainstSchema
  // does not implement. It walks the root, every sub-schema a rule holds and every $ref target.
  function unsupportedRules(root) {
    const isObject = (item) => item !== null && typeof item === "object" && !Array.isArray(item);
    const isNumber = (item) => typeof item === "number" && Number.isFinite(item);
    const isNames = (item) => Array.isArray(item) && item.every((name) => typeof name === "string");
    const isPattern = (item) => {
      if (typeof item !== "string") return false;
      try {
        new RegExp(item);
        return true;
      } catch (error) {
        return false;
      }
    };
    const readableForms = {
      type: (item) => typeof item === "string" || isNames(item),
      enum: (item) => Array.isArray(item),
      minLength: isNumber,
      minimum: isNumber,
      minItems: isNumber,
      uniqueItems: (item) => typeof item === "boolean",
      pattern: isPattern,
      required: isNames,
    };
    const escape = (key) => key.replace(/~/g, "~0").replace(/\//g, "~1");
    const problems = [];
    const walked = new Set();
    const refuse = (what, pointer) => {
      problems.push("The sheet's schema uses " + what + " at " + pointer + ", which this page can't check.");
    };

    const walk = (schema, pointer, holder) => {
      if (!isObject(schema)) {
        refuse('"' + holder + '" with something that is not a schema', pointer);
        return;
      }
      if (walked.has(schema)) return;
      walked.add(schema);

      const members = (value, key, at, each) => {
        if (!isObject(value)) {
          refuse('"' + key + '" as something other than a map of schemas', pointer);
          return;
        }
        Object.keys(value).forEach((name) => each(value[name], at + "/" + escape(name)));
      };
      const entries = (value, key, at) => {
        if (!Array.isArray(value)) {
          refuse('"' + key + '" as something other than a list of schemas', pointer);
          return;
        }
        value.forEach((sub, index) => walk(sub, at + "/" + index, key));
      };

      Object.keys(schema).forEach((key) => {
        const value = schema[key];
        const at = pointer + "/" + escape(key);
        if (key === "$defs" || key === "definitions" || key === "properties") {
          members(value, key, at, (sub, subPointer) => walk(sub, subPointer, key));
        } else if (key === "allOf" || key === "anyOf") {
          entries(value, key, at);
        } else if (key === "if" || key === "then" || key === "not") {
          walk(value, at, key);
        } else if (key === "items") {
          if (Array.isArray(value)) {
            refuse('"items" as a list', pointer);
          } else {
            walk(value, at, key);
          }
        } else if (key === "additionalProperties") {
          if (typeof value !== "boolean") refuse('"additionalProperties" as something other than true or false', pointer);
        } else if (key === "$ref") {
          const resolved = resolvePointer(root, value);
          if (resolved.problem !== undefined) {
            refuse('"$ref" with ' + JSON.stringify(value) + " (" + resolved.problem + ")", pointer);
          } else {
            walk(resolved.target, value, key);
          }
        } else if (Object.prototype.hasOwnProperty.call(readableForms, key)) {
          if (!readableForms[key](value)) refuse('"' + key + '" with a value this page does not read', pointer);
        } else if (!READ_RULES.includes(key) && !ANNOTATIONS.includes(key)) {
          refuse('the rule "' + key + '"', pointer);
        }
      });
    };

    // A cycle that never descends into a child value (only $ref, allOf, anyOf, not, if, then) can never
    // end for any value, so it is refused here whatever the data or the order of an anyOf's branches.
    // Cycles through "properties" or "items" descend into a child value and stay allowed.
    const state = new Map();
    const sameValue = (schema, pointer) => {
      if (!isObject(schema) || state.get(schema) === 2) return;
      state.set(schema, 1);
      const next = (sub, at) => {
        if (!isObject(sub)) return;
        if (state.get(sub) === 1) {
          refuse('"$ref" that leads back to itself without reading anything', pointer);
          return;
        }
        sameValue(sub, at);
      };
      if (schema.$ref !== undefined) {
        const resolved = resolvePointer(root, schema.$ref);
        if (resolved.problem === undefined) next(resolved.target, schema.$ref);
      }
      ["allOf", "anyOf"].forEach((key) => {
        if (Array.isArray(schema[key])) schema[key].forEach((sub, index) => next(sub, pointer + "/" + key + "/" + index));
      });
      ["not", "if", "then"].forEach((key) => next(schema[key], pointer + "/" + key));
      state.set(schema, 2);
    };

    walk(root, "#", "schema");
    // Start from every schema the walk reached, since a cycle may sit under a property.
    Array.from(walked).forEach((schema) => sameValue(schema, "#"));
    return problems;
  }

  class UncheckableSchema extends Error {}

  function validateAgainstSchema(root, schema, value, path, problems, viaRefs) {
    const isObject = (item) => item !== null && typeof item === "object" && !Array.isArray(item);
    const typeOf = (item) => {
      if (item === null) return "null";
      if (Array.isArray(item)) return "array";
      if (typeof item === "number") return Number.isInteger(item) ? "integer" : "number";
      return typeof item;
    };
    const matchesType = (name, item) => typeOf(item) === name || (name === "number" && typeOf(item) === "integer");
    const quiet = (sub, item) => {
      const found = [];
      validateAgainstSchema(root, sub, item, path, found, chain);
      return found;
    };
    const where = path || "The sheet";
    // The $refs followed so far for this same value, so a $ref that leads back to itself ends.
    const chain = viaRefs || [];

    if (schema.$ref !== undefined) {
      const resolved = resolvePointer(root, schema.$ref);
      if (resolved.problem !== undefined) {
        // Not a mismatch: it must not turn into a passing "not", a skipped "if" or a failed "anyOf"
        // branch, so it ends the whole check by type, whatever any schema text says.
        throw new UncheckableSchema(where + " follows a rule this page can't find.");
      }
      if (chain.includes(schema.$ref)) {
        throw new UncheckableSchema(where + " follows a rule that leads back to itself.");
      }
      validateAgainstSchema(root, resolved.target, value, path, problems, chain.concat([schema.$ref]));
    }

    if (schema.type !== undefined) {
      const names = Array.isArray(schema.type) ? schema.type : [schema.type];
      if (!names.some((name) => matchesType(name, value))) {
        problems.push(where + " must be " + names.join(" or ") + ".");
        return;
      }
    }
    if (schema.const !== undefined && canonical(value) !== canonical(schema.const)) {
      problems.push(where + " must be " + JSON.stringify(schema.const) + ".");
    }
    if (schema.enum && !schema.enum.some((option) => canonical(option) === canonical(value))) {
      problems.push(where + " must be one of " + schema.enum.map((option) => typeof option === "string" ? option : JSON.stringify(option)).join(", ") + ".");
    }

    if (typeof value === "string") {
      if (schema.minLength !== undefined && [...value].length < schema.minLength) {
        problems.push(where + (schema.minLength > 1 ? " must be at least " + schema.minLength + " characters long." : " must not be empty."));
      }
      if (schema.pattern && !new RegExp(schema.pattern).test(value)) {
        // The id wording belongs to the schema's own id rule; any other pattern is named by its description.
        const idRule = isObject(root.$defs) && isObject(root.$defs.id) ? root.$defs.id.pattern : undefined;
        if (schema.pattern === idRule) {
          problems.push(where + ' has the value "' + value + '", which is not a valid id (lowercase letters, digits and hyphens).');
        } else {
          const rule = typeof schema.description === "string" && schema.description !== "" ? schema.description : "it must match the pattern " + schema.pattern;
          problems.push(where + ' has the value "' + value + '", which does not fit its rule: ' + rule);
        }
      }
    }
    if (typeof value === "number" && schema.minimum !== undefined && value < schema.minimum) {
      problems.push(where + " must be at least " + schema.minimum + ".");
    }

    if (Array.isArray(value)) {
      if (schema.minItems !== undefined && value.length < schema.minItems) {
        problems.push(where + " must have at least " + schema.minItems + " item(s).");
      }
      if (schema.uniqueItems === true && new Set(value.map(canonical)).size !== value.length) {
        problems.push(where + " must not repeat an item.");
      }
      if (schema.items) {
        value.forEach((item, index) => {
          validateAgainstSchema(root, schema.items, item, (path ? path + "." : "") + index, problems);
        });
      }
    }

    if (isObject(value)) {
      (schema.required || []).forEach((key) => {
        if (!Object.prototype.hasOwnProperty.call(value, key)) {
          problems.push(where + " has no " + key + " key.");
        }
      });
      const known = schema.properties || {};
      Object.keys(value).forEach((key) => {
        if (Object.prototype.hasOwnProperty.call(known, key)) {
          validateAgainstSchema(root, known[key], value[key], (path ? path + "." : "") + key, problems);
        } else if (schema.additionalProperties === false) {
          problems.push(where + " has an unexpected key " + key + ".");
        }
      });
    }

    (schema.allOf || []).forEach((sub) => {
      validateAgainstSchema(root, sub, value, path, problems, chain);
    });
    if (schema.if && schema.then && quiet(schema.if, value).length === 0) {
      if (quiet(schema.then, value).length > 0) {
        problems.push(schema.description || (where + " does not fit its kind."));
      }
    }
    if (schema.not && quiet(schema.not, value).length === 0) {
      problems.push(schema.description || (where + " carries something it must not."));
    }
    if (schema.anyOf && !schema.anyOf.some((sub) => quiet(sub, value).length === 0)) {
      problems.push(where + " fits none of its allowed shapes.");
    }
  }

  function checkSheet(sheet, schema) {
    const isObject = (value) => value !== null && typeof value === "object" && !Array.isArray(value);
    const isText = (value) => typeof value === "string" && value.length > 0;

    if (!isObject(schema) || !(isObject(schema.properties) || isObject(schema.$defs))) {
      return ["The sheet's schema file isn't a schema."];
    }
    const unsupported = unsupportedRules(schema);
    if (unsupported.length > 0) {
      return unsupported;
    }

    const shape = [];
    try {
      validateAgainstSchema(schema, schema, sheet, "", shape);
    } catch (error) {
      if (error instanceof UncheckableSchema) return ["The sheet's schema can't be checked: " + error.message];
      throw error;
    }
    if (shape.length > 0) {
      // Name a card by its id, not its position, when it has one.
      return shape.map((problem) => problem.replace(/^cards\.(\d+)(?=[. ])/, (whole, index) => {
        const card = sheet.cards[Number(index)];
        return isObject(card) && isText(card.id) ? 'Card "' + card.id + '"' : "Card number " + (Number(index) + 1);
      }));
    }

    const problems = [];
    if (!Array.isArray(sheet.cards)) {
      return ["The sheet's cards must be a list."];
    }
    const cardIds = new Set();
    const reportedDuplicates = new Set();
    sheet.cards.forEach((card, cardIndex) => {
      if (!isObject(card)) {
        problems.push("Card number " + (cardIndex + 1) + " must be an object.");
        return;
      }
      if (cardIds.has(card.id) && !reportedDuplicates.has(card.id)) {
        reportedDuplicates.add(card.id);
        problems.push('Two cards share the id "' + card.id + '".');
      }
      cardIds.add(card.id);

      const optionIds = new Set();
      const reportedOptions = new Set();
      if (!Array.isArray(card.options)) {
        problems.push('Card "' + card.id + '" must have its options as a list.');
        return;
      }
      card.options.forEach((option) => {
        if (!isObject(option)) {
          problems.push('Card "' + card.id + '" has an option that is not an object.');
          return;
        }
        if (optionIds.has(option.id) && !reportedOptions.has(option.id)) {
          reportedOptions.add(option.id);
          problems.push('Card "' + card.id + '" has two options with the id "' + option.id + '".');
        }
        optionIds.add(option.id);
      });

      if (card.recommendation && card.recommendation.optionId !== undefined && !optionIds.has(card.recommendation.optionId)) {
        problems.push('Card "' + card.id + '" recommends the option "' + card.recommendation.optionId + '", which is not one of its options.');
      }
    });

    if (sheet.remainder && Array.isArray(sheet.remainder.unsettled)) {
      sheet.remainder.unsettled.forEach((id) => {
        if (!cardIds.has(id)) {
          problems.push('The unsettled list names "' + id + '", which is not a card in this sheet.');
        }
      });
    }

    return problems;
  }
</script>

<script>
  (function () {
    const status = document.getElementById("sheet-status");
    const errorBox = document.getElementById("sheet-error");
    const errorList = document.getElementById("sheet-error-list");
    const cardsHost = document.getElementById("sheet-cards");
    const titleHost = document.getElementById("sheet-title");
    const gate = document.getElementById("sheet-gate");
    const countHost = document.getElementById("sheet-count");
    const whyBox = document.getElementById("sheet-why");
    const itemsHost = document.getElementById("sheet-items");
    const stepperHost = document.getElementById("sheet-stepper");
    const footerHost = document.getElementById("sheet-footer");
    const doneBox = document.getElementById("sheet-done");
    const historyBox = document.getElementById("sheet-history");
    const finalHost = document.getElementById("sheet-final");

    // The words on the answer buttons, by the value a stored answer takes. A value the schema lists that
    // has no words here leaves the answer controls off. The option value takes its words from the card.
    const ANSWER_LABELS = { aligned: "Aligned", discuss: "Discuss" };

    // What the sheet's schema says a stored answer is (its $defs.answer): { root, rule, kinds }, where
    // kinds lists the values in the order the schema gives them, and carriesOption marks the one the schema
    // ties to a string optionId. Null until the schema was read, and left null when it is not in that shape.
    let answerShape = null;

    function readAnswerShape(schema) {
      const isObject = function (item) { return item !== null && typeof item === "object" && !Array.isArray(item); };
      const rule = isObject(schema.$defs) ? schema.$defs.answer : undefined;
      if (!isObject(rule) || !isObject(rule.properties) || !isObject(rule.properties.answer)) return null;
      const listed = rule.properties.answer.enum;
      if (!Array.isArray(listed)) return null;
      const values = listed.filter(function (item) { return item !== null; });
      if (values.length === 0 || values.some(function (item) { return typeof item !== "string"; })) return null;
      const carrying = [];
      (Array.isArray(rule.allOf) ? rule.allOf : []).forEach(function (entry) {
        if (!isObject(entry) || !isObject(entry.if) || !isObject(entry.then)) return;
        const picked = isObject(entry.if.properties) ? entry.if.properties.answer : undefined;
        const named = isObject(entry.then.properties) ? entry.then.properties.optionId : undefined;
        if (isObject(picked) && typeof picked.const === "string" && isObject(named) && named.type === "string") {
          carrying.push(picked.const);
        }
      });
      if (carrying.length !== 1 || !values.includes(carrying[0])) return null;
      const kinds = values.map(function (value) { return { value: value, carriesOption: value === carrying[0] }; });
      if (kinds.some(function (kind) { return !kind.carriesOption && typeof ANSWER_LABELS[kind.value] !== "string"; })) return null;
      return { root: schema, rule: rule, kinds: kinds };
    }

    // True when the stored document fits the given rule of the schema (answer, draftVerdict or verdict).
    function fitsRule(root, rule, data) {
      const problems = [];
      try {
        validateAgainstSchema(root, rule, data, "", problems);
      } catch (error) {
        if (error instanceof UncheckableSchema) return false;
        throw error;
      }
      return problems.length === 0;
    }

    function fitsAnswerRule(data) {
      return fitsRule(answerShape.root, answerShape.rule, data);
    }

    // The words on the final sheet's verdict buttons, by the value a stored verdict takes.
    const VERDICT_LABELS = { approve: "Approve", "not-yet": "Not yet" };

    // What the sheet's schema says a verdict is: { root, draft, sent, values }, where draft is $defs.draftVerdict,
    // sent is $defs.verdict and values lists the non-null verdicts the draft allows, in the schema's order. Null
    // until the schema was read, and left null when it is not in that shape: the last card's controls stay off.
    let verdictShape = null;

    // The SHA-256 (lowercase hex) of the exact bytes the page fetched as sheet.json: the revision every stored
    // verdict is bound to, and the id of that revision's own draft and verdict documents. Null until worked out,
    // and left null when the browser can't compute it.
    let sheetDigest = null;

    // The exact bytes of that same fetch, kept to tell at Send time whether the published sheet has moved on.
    let sheetBytes = null;

    // True when a stored verdict document belongs to the sheet revision on screen.
    function forThisSheet(data) {
      return sheetDigest !== null && typeof data.sheet === "string" && data.sheet === sheetDigest;
    }

    function readVerdictShape(schema) {
      const isObject = function (item) { return item !== null && typeof item === "object" && !Array.isArray(item); };
      const defs = isObject(schema.$defs) ? schema.$defs : {};
      const draft = defs.draftVerdict;
      const sent = defs.verdict;
      if (!isObject(draft) || !isObject(draft.properties) || !isObject(draft.properties.verdict) || !isObject(sent)) return null;
      const listed = draft.properties.verdict.enum;
      if (!Array.isArray(listed)) return null;
      const values = listed.filter(function (item) { return item !== null; });
      if (values.length === 0 || values.some(function (item) { return typeof item !== "string" || typeof VERDICT_LABELS[item] !== "string"; })) return null;
      return { root: schema, draft: draft, sent: sent, values: values };
    }

    const SAY = {
      noStore: "Answers can't be saved in this view.",
      readOnly: "This sheet is read-only for you. Only its owner can answer.",
      loading: "Loading your saved answers…",
      readFailed: "Your saved answers couldn't be loaded.",
      connectStalled: "The sheet's store isn't answering.",
      writeStalled: "Your latest answer isn't saved yet. Keep this page open: it saves when the sheet's store answers. Reloading shows only what was saved.",
      verdictDraft: "Your verdict is a draft until you send it.",
      verdictFirst: "Tap Approve or Not yet first.",
      verdictChecking: "Making sure your answers are saved…",
      verdictSending: "Sending…",
      verdictSlow: "Sending is taking longer than it should. Keep this page open.",
      verdictFailed: "The verdict didn't send.",
      verdictConflict: "More than one verdict was sent for this sheet from different windows. The session will ask you which one counts.",
      verdictNoId: "This browser can't make a unique id for the verdict, so it can't be sent here.",
      verdictStale: "This sheet was updated after you opened it. Reload the page to see the current version before sending.",
      sheetUnchecked: "The sheet could not be checked, so nothing was sent.",
      verdictNoDigest: "This browser can't tell which version of the sheet this is, so the verdict can't be sent here.",
    };
    const NOTE_PAUSE_MS = 1000;
    // How long a save or a read of the saved answers may stay unanswered before the page says so.
    const STALL_MS = 10000;
    // How often Send verdict looks again while it waits for the cards' answers to be saved.
    const SEND_POLL_MS = 200;
    // Every card's controls, by card id. Nothing can be answered until ready is true, which happens
    // only once the store, the owner check and the read of the saved answers have all succeeded.
    const controllers = new Map();
    // The final sheet's last card, kept apart from the cards: it never feeds the count or the rows.
    let verdictController = null;
    let store = null;
    let ready = false;
    // True from the moment Send verdict is tapped until its write fails or the verdict is sent, and for
    // good once the verdict is sent: nothing on the sheet may change while either holds.
    let sending = false;
    let sent = false;
    // True once the store is known to be unusable here (no store, a non-owner, no answer shape), as opposed to still loading.
    let cannotSave = false;
    let restoring = false;
    let readStalled = false;
    let readAttempt = 0;
    let readTimer = null;
    let connectAttempt = 0;
    const DEADLINE = { stalled: true };

    // Waits for one step of getting the store and the owner check, but no longer than STALL_MS. A step
    // that stays unanswered is rejected with DEADLINE so the caller can offer a retry.
    function withDeadline(start) {
      return new Promise(function (resolve, reject) {
        const timer = setTimeout(function () { reject(DEADLINE); }, STALL_MS);
        let pending;
        try {
          pending = Promise.resolve(start());
        } catch (error) {
          clearTimeout(timer);
          reject(error);
          return;
        }
        pending.then(function (value) { clearTimeout(timer); resolve(value); }, function (error) { clearTimeout(timer); reject(error); });
      });
    }

    function showErrors(problems) {
      errorList.replaceChildren();
      problems.forEach(function (problem) {
        const item = document.createElement("li");
        item.textContent = problem;
        errorList.appendChild(item);
      });
      cardsHost.replaceChildren();
      status.hidden = true;
      errorBox.hidden = false;
    }

    function textElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = text;
      return element;
    }

    function buildImages(images) {
      const wrap = document.createElement("div");
      wrap.className = "sheet-images";
      images.forEach(function (image) {
        const figure = document.createElement("figure");
        figure.className = "sheet-figure";
        const picture = document.createElement("img");
        picture.setAttribute("src", image.src);
        picture.setAttribute("alt", image.alt);
        figure.appendChild(picture);
        if (typeof image.caption === "string" && image.caption !== "") {
          figure.appendChild(textElement("figcaption", "sh-caption", image.caption));
        }
        wrap.appendChild(figure);
      });
      return wrap;
    }

    function buildOptions(options) {
      const list = document.createElement("ul");
      options.forEach(function (option) {
        const item = document.createElement("li");
        item.appendChild(textElement("strong", "", option.label));
        item.appendChild(textElement("span", "sheet-consequence", option.consequence));
        list.appendChild(item);
      });
      return list;
    }

    function buildRecommendation(recommendation) {
      const wrap = document.createElement("div");
      wrap.className = "sheet-recommendation";
      wrap.appendChild(textElement("p", "", recommendation.text));
      wrap.appendChild(textElement("p", "", recommendation.reason));
      return wrap;
    }

    function sameAnswer(one, other) {
      return one.answer === other.answer && one.optionId === other.optionId && one.note === other.note;
    }

    // Nothing on the sheet may be edited before the saved answers are read, while a Send is under way or
    // once the verdict is sent.
    function canEdit() {
      return ready && !sending && !sent;
    }

    // The answer row, the note and the save line of one saver: a card's answers, or the final sheet's draft
    // verdict. The spec says what differs: the choices, the document's path, how a state becomes a document
    // and a stored document becomes a state, the id of the note, whether the controls may be used now, and
    // where the controller is kept. Every write goes through save(), which
    // keeps at most one write in flight per saver, so the store receives writes in tap order and the last
    // tap is the last write. A write that stays unanswered past STALL_MS shows "Not saved" with no Try
    // again (a second write now could land out of order); later taps wait, and when the stalled write
    // settles the newest answer goes out next. The acknowledged answer is trusted only after a write
    // resolved: from the moment a write starts until it resolves it is unknown, so a rejected or stalled
    // write leaves every later save sending the newest answer, and "Saved" follows only a resolved write.
    // A state is always { answer, optionId, note }: a verdict is the answer, with no option.
    function addSaver(spec, article) {
      const choices = spec.choices;
      const none = { answer: null, optionId: null, note: "" };
      let latest = none;
      const unknown = { answer: undefined, optionId: undefined, note: undefined };
      let acked = none;
      let inFlight = null;
      let stalled = false;
      let stallTimer = null;
      let shown = "idle";
      let timer = null;
      let switchedOn = false;
      let retryButton = null;

      const row = document.createElement("div");
      row.className = "answer-row";
      row.setAttribute("role", "group");
      row.setAttribute("aria-label", spec.rowLabel);
      const buttons = choices.map(function (choice) {
        const button = textElement("button", "sh-button", choice.label);
        button.setAttribute("type", "button");
        button.setAttribute("aria-pressed", "false");
        button.disabled = true;
        button.addEventListener("click", function () {
          if (!spec.live()) return;
          setLatest({ answer: choice.answer, optionId: choice.optionId, note: latest.note });
          save();
        });
        row.appendChild(button);
        return button;
      });

      const noteLabel = textElement("label", "sh-label", "Note");
      noteLabel.setAttribute("for", spec.noteId);
      const note = document.createElement("textarea");
      note.id = spec.noteId;
      note.className = "sh-field";
      note.setAttribute("rows", "3");
      note.disabled = true;
      note.addEventListener("input", function () {
        if (!spec.live()) return;
        setLatest({ answer: latest.answer, optionId: latest.optionId, note: note.value });
        clearTimeout(timer);
        timer = setTimeout(save, NOTE_PAUSE_MS);
      });
      note.addEventListener("change", function () {
        if (!spec.live()) return;
        setLatest({ answer: latest.answer, optionId: latest.optionId, note: note.value });
        save();
      });

      const saveLine = document.createElement("div");
      saveLine.className = "save-line";
      saveLine.setAttribute("aria-live", "polite");
      saveLine.hidden = true;

      function paint() {
        buttons.forEach(function (button, index) {
          const choice = choices[index];
          const picked = latest.answer === choice.answer && latest.optionId === choice.optionId;
          button.className = picked ? "sh-button sh-button--main" : "sh-button";
          button.setAttribute("aria-pressed", picked ? "true" : "false");
        });
        refreshSheet();
      }

      function showStatus(kind) {
        shown = kind;
        retryButton = null;
        const parts = [];
        if (kind === "saving") {
          parts.push(textElement("span", "sh-caption", "Saving…"));
        } else if (kind === "saved") {
          parts.push(textElement("span", "sh-caption", "Saved"));
        } else if (kind === "stalled") {
          parts.push(textElement("span", "sh-badge sh-badge--warning", "Not saved"));
          parts.push(textElement("span", "sh-caption", SAY.writeStalled));
        } else if (kind === "failed") {
          parts.push(textElement("span", "sh-badge sh-badge--warning", "Not saved"));
          parts.push(textElement("span", "sh-caption", "That answer didn't reach the sheet."));
          retryButton = textElement("button", "sh-button", "Try again");
          retryButton.setAttribute("type", "button");
          retryButton.disabled = !switchedOn;
          retryButton.addEventListener("click", function () {
            if (!spec.live()) return;
            save(true);
          });
          parts.push(retryButton);
        }
        saveLine.replaceChildren(...parts);
        saveLine.hidden = kind === "idle";
        refreshSheet();
      }

      // Any change to the answer or the note clears what the status said and shows that a save is due.
      function setLatest(next) {
        if (sameAnswer(next, latest)) return;
        latest = next;
        paint();
        if (!stalled) showStatus("saving");
      }

      // The one place a write is started. While a write is in flight nothing else is sent; settle() sends
      // the newest state once it answers. Try again (forced) only exists when nothing is in flight.
      function save(forced) {
        clearTimeout(timer);
        timer = null;
        if (!ready) return;
        if (inFlight !== null) return;
        if (forced !== true && sameAnswer(latest, acked)) {
          if (shown === "saving") showStatus("idle");
          return;
        }
        send();
      }

      function send() {
        const body = latest;
        inFlight = body;
        // What the store holds is unknown until this write resolves; a rejected or stalled one leaves it so.
        acked = unknown;
        stalled = false;
        clearTimeout(stallTimer);
        stallTimer = setTimeout(function () {
          if (inFlight === null) return;
          stalled = true;
          showStatus("stalled");
        }, STALL_MS);
        showStatus("saving");
        let request;
        try {
          // The document written here has the shape the schema defines for this saver's path.
          request = Promise.resolve(store.doc(spec.path).set(spec.document(body)));
        } catch (error) {
          request = Promise.reject(error);
        }
        request.then(function () { settle(body, true); }, function () { settle(body, false); });
      }

      function settle(body, saved) {
        inFlight = null;
        stalled = false;
        clearTimeout(stallTimer);
        if (saved) acked = body;
        // A note's pause is still running: it sends the newest state itself when it ends.
        if (timer !== null) {
          showStatus("saving");
          return;
        }
        if (!sameAnswer(latest, body)) {
          send();
          return;
        }
        showStatus(saved ? "saved" : "failed");
      }

      spec.keep({
        // A stored document restores what the spec's rule lets it restore.
        restore: function (data) {
          const state = spec.state(data);
          latest = state;
          acked = state;
          note.value = state.note;
          paint();
          showStatus("idle");
        },
        // Turns the controls (and a Try again on the save line) on or off.
        setEnabled: function (on) {
          switchedOn = on;
          buttons.forEach(function (button) { button.disabled = !on; });
          note.disabled = !on;
          if (retryButton !== null) retryButton.disabled = !on;
        },
        // True while this saver holds an answer or note the store has not confirmed: a write in flight, a
        // newer state waiting behind it, a note-pause timer still running, or a write that failed or stalled.
        unsaved: function () {
          return inFlight !== null || timer !== null || !sameAnswer(latest, acked);
        },
        // The latest pick (what the pressed button shows) and the kind the save line shows now.
        state: function () {
          return { answer: latest.answer, optionId: latest.optionId, save: shown };
        },
        // The latest pick and note, as they stand now.
        current: function () {
          return { answer: latest.answer, optionId: latest.optionId, note: latest.note };
        },
        // Cuts a note's pause short: the pending save runs now.
        flush: function () {
          if (timer !== null) save();
        },
      });

      article.appendChild(row);
      article.appendChild(noteLabel);
      article.appendChild(note);
      article.appendChild(saveLine);
    }

    // A card's answers: the schema's answer kinds, one button per option for the kind tied to an option, and a
    // document written whole at answers/<card id>.
    function addAnswerParts(card, article) {
      const choices = [];
      (answerShape === null ? [] : answerShape.kinds).forEach(function (kind) {
        if (kind.carriesOption) {
          card.options.forEach(function (option) {
            choices.push({ label: option.label, answer: kind.value, optionId: option.id });
          });
        } else {
          choices.push({ label: ANSWER_LABELS[kind.value], answer: kind.value, optionId: null });
        }
      });
      const optionIds = new Set(card.options.map(function (option) { return option.id; }));
      addSaver({
        choices: choices,
        rowLabel: "Your answer",
        noteId: "note-" + card.id,
        path: "answers/" + card.id,
        live: canEdit,
        document: function (body) { return { answer: body.answer, optionId: body.optionId, note: body.note }; },
        // A stored document restores a pick only when it fits the schema's answer rule and, for an option
        // pick, names an option the card offers. A document that does not fit restores only its note, and
        // only when that is text.
        state: function (data) {
          const state = { answer: null, optionId: null, note: typeof data.note === "string" ? data.note : "" };
          const kind = answerShape !== null && fitsAnswerRule(data)
            ? answerShape.kinds.find(function (entry) { return entry.value === data.answer; })
            : undefined;
          if (kind && !kind.carriesOption) {
            state.answer = kind.value;
          } else if (kind && optionIds.has(data.optionId)) {
            state.answer = kind.value;
            state.optionId = data.optionId;
          }
          return state;
        },
        keep: function (controller) { controllers.set(card.id, controller); },
      }, article);
    }

    // The final sheet's last card: the verdict's buttons, written whole at draft-verdict/<digest> as the owner
    // taps. Nothing it writes counts as the owner's verdict; only sendVerdict writes verdict/<digest>.
    function addVerdictParts(article) {
      addSaver({
        choices: verdictShape === null ? [] : verdictShape.values.map(function (value) {
          return { label: VERDICT_LABELS[value], answer: value, optionId: null };
        }),
        rowLabel: "Your verdict",
        noteId: "verdict-note",
        path: "draft-verdict/" + sheetDigest,
        live: function () { return canEdit() && verdictShape !== null && sheetDigest !== null; },
        document: function (body) { return { verdict: body.answer, note: body.note, sheet: sheetDigest }; },
        // A stored draft restores a pick only when it fits the schema's draft rule; one that does not fit
        // restores only its note, and only when that is text.
        state: function (data) {
          const state = { answer: null, optionId: null, note: typeof data.note === "string" ? data.note : "" };
          if (verdictShape !== null && fitsRule(verdictShape.root, verdictShape.draft, data) && verdictShape.values.includes(data.verdict)) {
            state.answer = data.verdict;
          }
          return state;
        },
        keep: function (controller) { verdictController = controller; },
      }, article);
    }

    function buildCard(card) {
      const article = document.createElement("article");
      article.className = "sh-card";
      article.id = "card-" + card.id;
      article.appendChild(textElement("span", card.warning ? "sh-badge sh-badge--warning" : "sh-badge", card.callKind));
      article.appendChild(textElement("h2", "", card.question));
      article.appendChild(textElement("p", "sh-label", "What's true now"));
      article.appendChild(textElement("p", "", card.context.now));
      article.appendChild(textElement("p", "sh-label", "Why it needs you"));
      article.appendChild(textElement("p", "", card.context.whyOwner));
      if (card.context.exactText !== null) {
        article.appendChild(textElement("p", "sh-label", "The exact text"));
        article.appendChild(textElement("blockquote", "", card.context.exactText));
      }
      if (card.images.length > 0) {
        article.appendChild(buildImages(card.images));
      }
      if (card.options.length > 0) {
        article.appendChild(textElement("p", "sh-label", "Options"));
        article.appendChild(buildOptions(card.options));
      }
      if (card.recommendation) {
        article.appendChild(textElement("p", "sh-label", "Recommendation"));
        article.appendChild(buildRecommendation(card.recommendation));
      }
      addAnswerParts(card, article);
      return article;
    }

    // The sheet around the cards. Everything it shows (the count, the item rows and their pills, the fold,
    // the stepper, the why box and the Done box) is worked out again from the cards' current states by
    // refreshSheet() and from nothing else, so no display can drift from what the cards hold.
    const PICK_PILLS = {
      aligned: ["sh-pill sh-pill--aligned", "Aligned"],
      discuss: ["sh-pill sh-pill--discuss", "Discuss"],
      picked: ["sh-pill sh-pill--aligned", "Picked"],
      open: ["sh-pill sh-pill--open", "Open"],
    };
    // One entry per card, in card order: { id, question, article, row }.
    let items = [];
    let sheetKind = "plain";
    let openIndex = 0;
    let expanded = false;
    let done = false;

    function actionButton(text, onClick) {
      const button = textElement("button", "sh-button", text);
      button.setAttribute("type", "button");
      button.addEventListener("click", onClick);
      return button;
    }

    function openAt(index) {
      if (index < 0 || index >= items.length) return;
      openIndex = index;
      refreshSheet();
    }

    const stepLabel = textElement("span", "sh-label", "");
    const prevButton = actionButton("‹ Previous", function () { openAt(openIndex - 1); });
    const nextButton = actionButton("Next ›", function () { openAt(openIndex + 1); });
    stepperHost.replaceChildren(stepLabel, prevButton, nextButton);

    const foldButton = actionButton("", function () {
      expanded = !expanded;
      refreshSheet();
    });
    foldButton.className = "sh-button sheet-fold";
    foldButton.setAttribute("aria-expanded", "false");
    foldButton.hidden = true;

    const whyHeading = textElement("h2", "", "");
    const whyText = textElement("p", "", "");
    whyBox.replaceChildren(whyHeading, whyText);

    const doneMessage = textElement("p", "", "");
    const backButton = actionButton("Back to the sheet", function () {
      // A card whose save was rejected opens first, so its Try again is in view.
      const failed = items.findIndex(function (item) { return controllers.get(item.id).state().save === "failed"; });
      if (failed >= 0) openIndex = failed;
      done = false;
      refreshSheet();
    });
    doneBox.replaceChildren(textElement("h2", "", "Done for now"), doneMessage, backButton);

    const doneButton = actionButton("Done for now", function () {
      // Part of the freeze: once Send verdict is tapped, Done can neither replace the sending or sent status nor claim the verdict does not count.
      if (sending || sent) return;
      controllers.forEach(function (controller) { controller.flush(); });
      if (verdictController !== null) verdictController.flush();
      done = true;
      refreshSheet();
    });
    footerHost.replaceChildren(textElement("p", "sh-caption", "Answers save as you tap"), doneButton);

    function whySentence(remainder) {
      const rounds = remainder.roundsRun;
      const fixes = remainder.fixesMade;
      const unsettled = remainder.unsettled.length;
      let text = "The review ran " + rounds + (rounds === 1 ? " round" : " rounds") + " and fixed " + fixes
        + (fixes === 1 ? " thing" : " things") + " itself. Everything else traces to your board or your rulings, so it isn't here.";
      if (unsettled === 1) {
        text += " 1 item here is a finding the review didn't settle.";
      } else if (unsettled > 1) {
        text += " " + unsettled + " items here are findings the review didn't settle.";
      }
      return text;
    }

    function pillOf(state) {
      if (state.answer === null) return PICK_PILLS.open;
      if (state.optionId !== null) return PICK_PILLS.picked;
      return PICK_PILLS[state.answer] || PICK_PILLS.aligned;
    }

    function pillElement(pill) {
      return textElement("span", pill[0], pill[1]);
    }

    function refreshSheet() {
      const total = items.length;
      const states = items.map(function (item) { return controllers.get(item.id).state(); });
      const notSavedKind = function (state) { return state.save === "failed" || state.save === "stalled"; };
      const answered = states.filter(function (state) { return state.answer !== null; });
      const discussing = answered.filter(function (state) { return state.answer === "discuss"; });

      // A final sheet may have no cards: there is then nothing to count, step through or list.
      countHost.textContent = total === 0
        ? "Nothing left to answer"
        : ready
          ? answered.length + " of " + total + " answered" + (discussing.length > 0 ? " · " + discussing.length + " to discuss" : "")
          : total + (total === 1 ? " item" : " items") + " · answers not loaded";
      countHost.hidden = false;

      // A card folds away only when it is answered, is not the open card and has nothing unsaved.
      const folding = ready && sheetKind === "remainder";
      const folded = states.map(function (state, index) {
        return folding && state.answer !== null && index !== openIndex && !notSavedKind(state);
      });
      items.forEach(function (item, index) {
        const state = states[index];
        const current = index === openIndex;
        item.article.hidden = !current;
        item.row.className = "sh-button" + (current ? " sh-button--main sheet-row is-current" : " sheet-row") + (folded[index] ? " is-folded" : "");
        item.row.setAttribute("aria-current", current ? "true" : "false");
        const parts = [textElement("span", "sheet-row-text", (index + 1) + " · " + item.question)];
        if (ready) parts.push(pillElement(pillOf(state)));
        if (notSavedKind(state)) parts.push(textElement("span", "sh-badge sh-badge--warning", "Not saved"));
        item.row.replaceChildren(...parts);
      });

      const foldedStates = states.filter(function (state, index) { return folded[index]; });
      const foldedWith = function (answer) {
        return foldedStates.filter(function (state) { return state.answer === answer && state.optionId === null; }).length;
      };
      const foldedPicks = foldedStates.filter(function (state) { return state.optionId !== null; }).length;
      const notSaved = states.filter(function (state, index) { return state.answer !== null && index !== openIndex && notSavedKind(state); }).length;
      const foldParts = [
        textElement("span", "", "Answered · " + foldedStates.length),
        textElement("span", PICK_PILLS.aligned[0], foldedWith("aligned") + " Aligned"),
        textElement("span", PICK_PILLS.discuss[0], foldedWith("discuss") + " Discuss"),
      ];
      if (foldedPicks > 0) foldParts.push(textElement("span", PICK_PILLS.picked[0], foldedPicks + " Picked"));
      if (notSaved > 0) foldParts.push(textElement("span", "sh-badge sh-badge--warning", notSaved + " not saved"));
      foldButton.replaceChildren(...foldParts);
      foldButton.hidden = foldedStates.length === 0;
      foldButton.setAttribute("aria-expanded", expanded ? "true" : "false");
      itemsHost.className = expanded ? "sheet-list is-expanded" : "sheet-list";

      stepLabel.textContent = "Item " + (openIndex + 1) + " of " + total;
      prevButton.disabled = openIndex === 0;
      nextButton.disabled = openIndex === total - 1;

      // The last card's draft verdict counts with the others: it is hidden on the Done screen, so a draft that is
      // pending or failed there must not be reported as saved.
      const unsavedCards = items.filter(function (item) { return controllers.get(item.id).unsaved(); }).length
        + (verdictController !== null && verdictController.unsaved() ? 1 : 0);
      const failedCards = states.filter(function (state) { return state.save === "failed"; }).length
        + (verdictController !== null && verdictController.state().save === "failed" ? 1 : 0);
      if (!ready) {
        doneMessage.textContent = cannotSave
          ? "Answers can't be saved in this view, so nothing here was saved."
          : "Your saved answers haven't loaded yet, so nothing new was saved here. Answers saved earlier are kept; open this link again to carry on.";
      } else if (failedCards > 0) {
        doneMessage.textContent = failedCards + (failedCards === 1 ? " answer" : " answers")
          + " didn't save. Go back to the sheet and tap Try again on each.";
      } else if (unsavedCards > 0) {
        doneMessage.textContent = unsavedCards + (unsavedCards === 1 ? " answer isn't" : " answers aren't")
          + " saved yet. Keep this page open until this says they're saved.";
      } else {
        doneMessage.textContent = sheetKind === "final"
          ? "Your answers are saved as drafts. Open this link again any time to carry on. Your verdict counts only once you tap Send verdict."
          : "Your answers are saved as drafts. Open this link again any time to carry on, and tell the session when the sheet is done.";
      }

      stepperHost.hidden = done || total === 0;
      itemsHost.hidden = done || total === 0;
      cardsHost.hidden = done || total === 0;
      footerHost.hidden = done;
      whyBox.hidden = done || sheetKind !== "remainder";
      historyBox.hidden = done || sheetKind !== "final";
      finalHost.hidden = done || sheetKind !== "final";
      doneBox.hidden = !done;
      refreshVerdict();
    }

    // The words a final sheet shares with the chat prose (lib/sheet_prose.py) live in one file, sheet-words.json,
    // which both read; the page fetches it before drawing a final sheet. Nothing here retypes them.
    let finalWords = null;
    function plural(count, noun) {
      return count + " " + noun + (count === 1 ? "" : "s");
    }
    function fill(template, values) {
      return template.replace(/\{(\w+)\}/g, function (whole, name) { return Object.prototype.hasOwnProperty.call(values, name) ? values[name] : whole; });
    }

    function historySentence(rounds, fixes, vet) {
      return finalWords.history.replace("{rounds}", function () { return plural(rounds, finalWords.roundNoun); })
        .replace("{fixes}", function () { return plural(fixes, finalWords.thingNoun); })
        .replace("{vet}", function () { return vet; });
    }

    // A final sheet's own parts: { send, status, row, retry }, once the sheet is drawn. What Send verdict says
    // when it is not the plain draft line is { kind, text, retry }: while a send is under way, why it refused,
    // or that the verdict didn't send. The verdict counts as sent only once its write resolved (sent).
    let finalUi = null;
    let sendView = null;
    let sentWord = "";

    // True when the sends found for this revision disagree, so no one verdict can be shown.
    let sentConflict = false;

    // Controls are on only when the sheet allows edits; the last card's also need a schema that says what a verdict is.
    function syncControls() {
      const on = canEdit();
      controllers.forEach(function (controller) { controller.setEnabled(on); });
      if (verdictController !== null) verdictController.setEnabled(on && verdictShape !== null && sheetDigest !== null);
      doneButton.disabled = sending || sent;
    }

    function buildFinal(final) {
      const history = final.history;
      const declined = final.declinedFindings;
      const parts = [
        textElement("h2", "", finalWords.historyHeading),
        textElement("p", "", historySentence(history.reviewRounds, history.fixesMade, history.vet)),
      ];
      if (declined.length > 0) {
        const list = document.createElement("ul");
        list.hidden = true;
        declined.forEach(function (finding) {
          list.appendChild(textElement("li", "", fill(finalWords.declinedItem, { summary: finding.summary, reason: finding.reason })));
        });
        const toggle = actionButton(finalWords.declinedHeading + " · " + declined.length, function () {
          list.hidden = !list.hidden;
          toggle.setAttribute("aria-expanded", list.hidden ? "false" : "true");
        });
        toggle.setAttribute("aria-expanded", "false");
        parts.push(toggle, list);
      } else {
        parts.push(textElement("p", "", finalWords.noDeclines));
      }
      historyBox.replaceChildren(...parts);

      const approval = final.approval;
      const article = document.createElement("article");
      article.className = "sh-card";
      article.id = "sheet-approval";
      article.appendChild(textElement("h2", "", finalWords.approveHeading));
      article.appendChild(textElement("p", "", approval.approvedBoard ? finalWords.tracesBoard : finalWords.tracesNoBoard));
      if (approval.approvedBoard) {
        article.appendChild(textElement("p", "", approval.boardSavedWithSpec ? finalWords.boardSaved : finalWords.boardNotSaved));
      }
      addVerdictParts(article);
      const send = actionButton("Send verdict", function () { sendVerdict(); });
      send.className = "sh-button sh-button--main";
      send.disabled = true;
      const row = document.createElement("div");
      row.className = "send-row";
      finalUi = {
        send: send,
        status: textElement("span", "sh-caption", ""),
        row: row,
        retry: actionButton("Try again", function () { sendVerdict(); }),
      };
      article.appendChild(row);

      const next = document.createElement("div");
      next.className = "sh-box";
      next.appendChild(textElement("p", "sh-label", finalWords.nextHeading));
      next.appendChild(textElement("p", "", finalWords.next));
      finalHost.replaceChildren(article, next);
    }

    // Send verdict and its line, worked out from the last card and the send state like everything else on the sheet.
    function refreshVerdict() {
      if (finalUi === null || verdictController === null) return;
      const picked = verdictController.current().answer !== null;
      const digested = ready && verdictShape !== null && sheetDigest !== null;
      const usable = digested && canMakeSendId();
      // A refusal because answers were unsaved goes away once every answer is saved.
      if (sendView !== null && sendView.kind === "refused" && !sending
          && !items.some(function (item) { return controllers.get(item.id).unsaved(); })) {
        sendView = null;
      }
      finalUi.send.disabled = !(usable && picked && !sending && !sent);
      let text = "";
      let retry = false;
      if (sent) {
        text = sentConflict ? SAY.verdictConflict : "Verdict sent: " + sentWord;
      } else if (sendView !== null) {
        text = sendView.text;
        retry = sendView.retry === true;
      } else if (usable) {
        text = picked ? SAY.verdictDraft : SAY.verdictFirst;
      } else if (digested) {
        text = SAY.verdictNoId;
      } else if (ready && verdictShape !== null) {
        text = SAY.verdictNoDigest;
      }
      finalUi.status.textContent = text;
      finalUi.row.replaceChildren(finalUi.send, finalUi.status, ...(retry ? [finalUi.retry] : []));
    }

    // Looks every SEND_POLL_MS until every card is saved. Gives { failed: n } as soon as a card's save was
    // rejected, { stalled: n } when n cards are still unsaved after STALL_MS, and {} when all are saved.
    function waitForSaves() {
      return new Promise(function (resolve) {
        let waited = 0;
        const look = function () {
          const all = items.map(function (item) { return controllers.get(item.id); });
          const failed = all.filter(function (controller) { return controller.state().save === "failed"; }).length;
          if (failed > 0) {
            resolve({ failed: failed });
            return;
          }
          const unsaved = all.filter(function (controller) { return controller.unsaved(); }).length;
          if (unsaved === 0) {
            resolve({});
            return;
          }
          if (waited >= STALL_MS) {
            resolve({ stalled: unsaved });
            return;
          }
          waited += SEND_POLL_MS;
          setTimeout(look, SEND_POLL_MS);
        };
        look();
      });
    }

    // The only place the verdict is written. It is single-flight and freezes the sheet while it runs: first every
    // pending note is saved and every answer waited for, then the last card's pick and note are captured once and
    // written as a new document under verdict/<digest>/sends. "Sent" is shown only after that write resolved. A write that is rejected leaves
    // nothing sent and offers Try again; one that stays unanswered offers no Try again while it may still land.
    async function sendVerdict() {
      if (sending || sent || !ready || verdictShape === null || sheetDigest === null || !canMakeSendId() || verdictController === null) return;
      if (verdictController.current().answer === null) return;
      sending = true;
      sendView = { kind: "working", text: SAY.verdictChecking };
      syncControls();
      refreshSheet();
      controllers.forEach(function (controller) { controller.flush(); });
      verdictController.flush();

      const outcome = await waitForSaves();
      const refuse = function (text) {
        sending = false;
        sendView = { kind: "refused", text: text };
        syncControls();
        refreshSheet();
      };
      if (outcome.failed !== undefined) {
        const failedAt = items.findIndex(function (item) { return controllers.get(item.id).state().save === "failed"; });
        if (failedAt >= 0) openIndex = failedAt;
        refuse(outcome.failed + (outcome.failed === 1 ? " answer didn't" : " answers didn't") + " save. Go back to "
          + (outcome.failed === 1 ? "it" : "them") + " and tap Try again, then send again.");
        return;
      }
      if (outcome.stalled !== undefined) {
        refuse(outcome.stalled + (outcome.stalled === 1 ? " answer isn't" : " answers aren't") + " saved yet. Keep this page open until "
          + (outcome.stalled === 1 ? "it says" : "they say") + " Saved, then send again.");
        return;
      }

      const chosen = verdictController.current();
      // The document written here has the shape the schema's $defs.verdict defines: the verdict and its note,
      // the sheet revision it answers, and every card's answer as the sheet froze it (the sheet cannot change
      // from here until the write settles).
      const payload = {
        verdict: chosen.answer,
        note: chosen.note,
        sheet: sheetDigest,
        answers: items.map(function (item) {
          const answer = controllers.get(item.id).current();
          return { card: item.id, answer: { answer: answer.answer, optionId: answer.optionId, note: answer.note } };
        }),
      };

      // Every Send creates its own document, verdict/<digest>/sends/<sendId>, with an id nobody else will pick, so
      // no send can replace another (the store keeps the last write to a path and has no transactions, so one
      // shared document could never be made safe). The digest keeps a late write from a page showing an older
      // revision out of a newer revision's sends. Just before writing, look at this revision's sends: when one
      // is already there (another open copy sent it), write nothing and show it as sent.
      let earlier = [];
      try {
        const snapshot = await withDeadline(function () { return store.collection(sendsPath()).get(); });
        earlier = sentVerdictsIn(snapshot);
      } catch (error) {
        sending = false;
        sendView = { kind: "failed", text: SAY.verdictFailed, retry: true };
        syncControls();
        refreshSheet();
        return;
      }
      if (earlier.length > 0) {
        showSends(earlier);
        sending = false;
        sendView = null;
        syncControls();
        refreshSheet();
        return;
      }
      // An older copy of the sheet must not write over a newer revision's verdict: look at the published sheet again,
      // and refuse when it is no longer the revision on screen.
      try {
        const current = await withDeadline(function () { return fetchFile("sheet.json", "The sheet's data file"); });
        if (!sameBytes(current.bytes, sheetBytes)) {
          sending = false;
          sendView = { kind: "stale", text: SAY.verdictStale };
          syncControls();
          refreshSheet();
          return;
        }
      } catch (error) {
        sending = false;
        sendView = { kind: "failed", text: SAY.sheetUnchecked, retry: true };
        syncControls();
        refreshSheet();
        return;
      }

      sendView = { kind: "sending", text: SAY.verdictSending };
      refreshSheet();
      let finished = false;
      const slow = setTimeout(function () {
        if (finished) return;
        sendView = { kind: "slow", text: SAY.verdictSlow };
        refreshSheet();
      }, STALL_MS);
      let request;
      try {
        request = Promise.resolve(store.doc(sendsPath() + "/" + newSendId()).set(payload));
      } catch (error) {
        request = Promise.reject(error);
      }
      request.then(function () {
        finished = true;
        clearTimeout(slow);
        sentWord = VERDICT_LABELS[payload.verdict];
        sent = true;
        sending = false;
        sendView = null;
        syncControls();
        refreshSheet();
      }, function () {
        finished = true;
        clearTimeout(slow);
        sending = false;
        sendView = { kind: "failed", text: SAY.verdictFailed, retry: true };
        syncControls();
        refreshSheet();
      });
    }

    function render(sheet) {
      const fragment = document.createDocumentFragment();
      controllers.clear();
      verdictController = null;
      finalUi = null;
      sending = false;
      sent = false;
      sendView = null;
      sentWord = "";
      sentConflict = false;
      historyBox.replaceChildren();
      finalHost.replaceChildren();
      items = sheet.cards.map(function (card, index) {
        const article = buildCard(card);
        fragment.appendChild(article);
        return { id: card.id, question: card.question, article: article, row: actionButton("", function () { openAt(index); }) };
      });
      sheetKind = sheet.kind;
      openIndex = 0;
      expanded = false;
      done = false;
      whyHeading.textContent = "Why only these " + sheet.cards.length;
      whyText.textContent = sheetKind === "remainder" ? whySentence(sheet.remainder) : "";
      if (sheetKind === "final") buildFinal(sheet.final);
      itemsHost.replaceChildren(foldButton, ...items.map(function (item) { return item.row; }));
      document.title = sheet.title;
      titleHost.textContent = sheet.title;
      cardsHost.replaceChildren(fragment);
      status.hidden = true;
      refreshSheet();
    }

    // The line under the app bar that says why the controls are off; a retry button rides along
    // when there is something to ask again (the function it runs).
    function say(text, onRetry) {
      const parts = [textElement("span", "", text)];
      if (onRetry) {
        const retry = textElement("button", "sh-button", "Try again");
        retry.setAttribute("type", "button");
        retry.addEventListener("click", function () { onRetry(); });
        parts.push(retry);
      }
      gate.replaceChildren(...parts);
      gate.hidden = false;
      cannotSave = text === SAY.noStore || text === SAY.readOnly;
      if (done) refreshSheet();
    }

    // A stored document's data when it is an object, else null.
    function documentData(doc) {
      const data = doc === undefined || doc.exists === false ? undefined : doc.data();
      return data === undefined || data === null || typeof data !== "object" || Array.isArray(data) ? null : data;
    }

    function applyDocument(doc) {
      const controller = controllers.get(doc.id);
      const data = documentData(doc);
      if (controller === undefined || data === null) return;
      controller.restore(data);
    }

    // The last card's saved draft, and the verdict if one was sent. A draft puts the pick and note back and
    // counts as nothing. A send that fits the schema's $defs.verdict means the verdict was sent: the sheet
    // shows it and stays locked. A document that does not fit is not a verdict and is ignored.
    function applyVerdicts(drafts, sends) {
      if (verdictController === null) return;
      // Only this revision's own documents are read (its draft under its digest, its sends under its digest):
      // another revision's draft or verdict is never looked at, so nothing of it is restored and nothing locks.
      const draft = documentData(drafts.docs.find(function (doc) { return doc.id === sheetDigest; }));
      if (draft !== null && forThisSheet(draft)) verdictController.restore(draft);
      const found = sentVerdictsIn(sends);
      if (found.length > 0) showSends(found);
    }

    // The collection this revision's sends live in: one document per Send, each under an id of its own.
    function sendsPath() {
      return "verdict/" + sheetDigest + "/sends";
    }

    // True when this browser can make the random id a send is stored under.
    function canMakeSendId() {
      return typeof crypto !== "undefined" && crypto !== null && typeof crypto.getRandomValues === "function";
    }

    // 32 lowercase hex characters from the browser's random source; throws when there is none.
    function newSendId() {
      if (!canMakeSendId()) throw new Error("no random source");
      const bytes = crypto.getRandomValues(new Uint8Array(16));
      return Array.from(bytes, function (byte) { return byte.toString(16).padStart(2, "0"); }).join("");
    }

    // The stored sends that are verdicts on this sheet revision, in the order the store listed them.
    function sentVerdictsIn(snapshot) {
      return snapshot.docs.map(documentData).filter(function (data) { return data !== null && isSentVerdict(data); });
    }

    // A value written the same way whatever order its keys came in, to tell whether two sends say the same thing.
    function canonical(value) {
      if (Array.isArray(value)) return "[" + value.map(canonical).join(",") + "]";
      if (value !== null && typeof value === "object") {
        return "{" + Object.keys(value).sort().map(function (key) { return JSON.stringify(key) + ":" + canonical(value[key]); }).join(",") + "}";
      }
      return JSON.stringify(value);
    }

    // Shows the sends found for this revision. One send, or several that say the same thing, is the verdict.
    // Several that differ in verdict, note or answers are not a verdict anyone can pick: the sheet locks and says so.
    function showSends(found) {
      const key = function (data) { return canonical({ verdict: data.verdict, note: data.note, answers: data.answers }); };
      if (found.every(function (data) { return key(data) === key(found[0]); })) {
        showSent(found[0]);
        return;
      }
      sentConflict = true;
      sent = true;
    }

    // True when a stored verdict fits the schema's $defs.verdict, carries a verdict this page knows, and answers
    // the sheet revision on screen.
    function isSentVerdict(verdict) {
      return verdictShape !== null && forThisSheet(verdict) && fitsRule(verdictShape.root, verdictShape.sent, verdict)
        && verdictShape.values.includes(verdict.verdict);
    }

    // Shows a stored verdict as the sent one: its word, its pick and note, and the sheet locked.
    function showSent(verdict) {
      sentWord = VERDICT_LABELS[verdict.verdict];
      sent = true;
      verdictController.restore({ verdict: verdict.verdict, note: verdict.note, sheet: verdict.sheet });
      // The sent verdict carries the answers it was sent with; the cards show those, not a later draft.
      verdict.answers.forEach(function (entry) {
        const controller = controllers.get(entry.card);
        if (controller !== undefined) controller.restore(entry.answer);
      });
    }

    // Controls turn on only after the saved answers were read and put on the cards. A failed or stalled
    // read is never an empty sheet: the controls stay off and the owner can ask again. A retry may
    // overlap a stalled read; the first read to succeed is applied once and any later one is ignored.
    async function restore() {
      if (ready || (restoring && !readStalled)) return;
      readAttempt += 1;
      const attempt = readAttempt;
      restoring = true;
      readStalled = false;
      clearTimeout(readTimer);
      say(SAY.loading, false);
      readTimer = setTimeout(function () {
        if (ready || attempt !== readAttempt) return;
        readStalled = true;
        say(SAY.readFailed, restore);
      }, STALL_MS);
      try {
        // A final sheet also reads its draft verdict and its verdict; a failed or stalled read of any one is a failed read.
        // Its sends live under its own digest, so without a digest there is nothing of this revision to read.
        const names = sheetKind === "final" ? ["answers", "draft-verdict"].concat(sheetDigest === null ? [] : [sendsPath()]) : ["answers"];
        const [saved, drafts, sends] = await Promise.all(names.map(function (name) { return store.collection(name).get(); }));
        if (ready) return;
        saved.docs.forEach(applyDocument);
        if (sheetKind === "final" && sends !== undefined) applyVerdicts(drafts, sends);
      } catch (error) {
        if (ready || attempt !== readAttempt) return;
        clearTimeout(readTimer);
        restoring = false;
        readStalled = false;
        say(SAY.readFailed, restore);
        return;
      }
      clearTimeout(readTimer);
      restoring = false;
      readStalled = false;
      ready = true;
      syncControls();
      gate.hidden = true;
      // The owner lands on the first call still waiting for an answer, or on the first when none is.
      const waiting = items.findIndex(function (item) { return controllers.get(item.id).state().answer === null; });
      openIndex = waiting === -1 ? 0 : waiting;
      refreshSheet();
    }

    // Only the sheet's owner may answer, so every step that is missing or fails leaves the controls off.
    async function connect() {
      const host = typeof window === "undefined" ? undefined : window.claude;
      if (!host || typeof host.use !== "function") {
        say(SAY.noStore, false);
        return;
      }
      connectAttempt += 1;
      const attempt = connectAttempt;
      say(SAY.loading, false);
      let db = null;
      try {
        db = await withDeadline(function () { return host.use("db"); });
      } catch (error) {
        if (error === DEADLINE) {
          if (attempt === connectAttempt) say(SAY.connectStalled, connect);
          return;
        }
        db = null;
      }
      if (attempt !== connectAttempt) return;
      if (!db) {
        say(SAY.noStore, false);
        return;
      }
      let owner = false;
      try {
        const user = await withDeadline(function () { return host.use("user"); });
        owner = Boolean(user) && (await withDeadline(function () { return user.isOwner(); })) === true;
      } catch (error) {
        if (error === DEADLINE) {
          if (attempt === connectAttempt) say(SAY.connectStalled, connect);
          return;
        }
        owner = false;
      }
      if (attempt !== connectAttempt) return;
      if (!owner) {
        say(SAY.readOnly, false);
        return;
      }
      store = db;
      await restore();
    }

    // The fetched file's exact bytes, the text decoded from them, and what that parses to.
    async function fetchFile(name, label) {
      let response;
      try {
        response = await fetch(name, { cache: "no-store" });
      } catch (error) {
        throw [label + " could not be loaded."];
      }
      if (!response.ok) {
        throw [label + " could not be loaded (HTTP " + response.status + ")."];
      }
      let bytes;
      let text;
      try {
        bytes = new Uint8Array(await response.arrayBuffer());
        // The text is decoded from a separate view of the same bytes; the bytes themselves are what a digest covers.
        text = new TextDecoder().decode(bytes);
      } catch (error) {
        throw [label + " could not be loaded."];
      }
      try {
        return { bytes: bytes, text: text, data: JSON.parse(text) };
      } catch (error) {
        throw [label + " isn't valid JSON."];
      }
    }

    async function fetchJson(name, label) {
      return (await fetchFile(name, label)).data;
    }

    function sameBytes(left, right) {
      if (left === null || right === null || left.length !== right.length) return false;
      for (let at = 0; at < left.length; at += 1) {
        if (left[at] !== right[at]) return false;
      }
      return true;
    }

    // The SHA-256 of the bytes, in lowercase hex; null when this browser can't compute it.
    async function digestOf(bytes) {
      try {
        if (typeof crypto === "undefined" || crypto === null || !crypto.subtle || typeof crypto.subtle.digest !== "function") return null;
        const hashed = new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
        return Array.from(hashed, function (byte) { return byte.toString(16).padStart(2, "0"); }).join("");
      } catch (error) {
        return null;
      }
    }

    async function load() {
      let sheetFile;
      let sheet;
      let schema;
      try {
        sheetFile = await fetchFile("sheet.json", "The sheet's data file");
        sheet = sheetFile.data;
        schema = await fetchJson("sheet.schema.json", "The sheet's schema file");
      } catch (problems) {
        showErrors(Array.isArray(problems) ? problems : ["The sheet could not be drawn."]);
        return;
      }
      const problems = checkSheet(sheet, schema);
      if (problems.length > 0) {
        showErrors(problems);
        return;
      }
      if (sheet.kind === "final") {
        try {
          finalWords = await fetchJson("sheet-words.json", "The sheet's wording file");
        } catch (problems) {
          showErrors(Array.isArray(problems) ? problems : ["The sheet could not be drawn."]);
          return;
        }
      }
      sheetBytes = sheetFile.bytes;
      sheetDigest = sheet.kind === "final" ? await digestOf(sheetFile.bytes) : null;
      answerShape = readAnswerShape(schema);
      verdictShape = readVerdictShape(schema);
      render(sheet);
      if (answerShape === null) {
        // The schema does not say what an answer is, so nothing could be saved or read back.
        say(SAY.noStore, false);
        return;
      }
      // The cards are already drawn: whatever goes wrong from here only leaves the controls off.
      connect().catch(function () {
        say(SAY.noStore, false);
      });
    }

    // One guard for the page: leaving or reloading while any card (or the last card) holds an unconfirmed
    // answer or note, or while a verdict is being sent, makes the browser ask first. When every card is saved
    // or idle it does nothing.
    if (typeof window !== "undefined" && typeof window.addEventListener === "function") {
      window.addEventListener("beforeunload", function (event) {
        let pending = sending;
        controllers.forEach(function (controller) {
          if (controller.unsaved()) pending = true;
        });
        if (verdictController !== null && verdictController.unsaved()) pending = true;
        if (!pending) return;
        event.preventDefault();
        event.returnValue = "";
      });
    }

    load().catch(function () {
      showErrors(["The sheet could not be drawn."]);
    });
  })();
</script>
