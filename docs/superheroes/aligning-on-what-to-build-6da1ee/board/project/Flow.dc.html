<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px;">The flow, start to handoff</h1>
<p style="margin: 0; font-size: 17px; color: #2B2B2B;">Four lanes: who acts at each step. Blue boxes are your moments. Yellow dots mark what is new compared with today.</p>
<p style="margin: 0; font-size: 15px; color: #4A4A4A;">A Start 1–4 · B Understand 5–6 · C Visualize 7–8 · D Write and check 9–11 · E Your remainder 12–13 · F Vet and approval 14–16 · G Handoff 17–18</p>

<text x="872" y="126.5"><tspan x="872" font-size="13" font-weight="700">Rules on each</tspan><tspan x="872" dy="15">question</tspan></text>
<text x="1040" y="126.5"><tspan x="1040" font-size="13" font-weight="700">6 · Confirms</tspan><tspan x="1040" dy="15">the framing</tspan></text>
<text x="1208" y="329"><tspan x="1208" font-size="13" font-weight="700">7 · Exploration</tspan><tspan x="1208" dy="15">journeys first,</tspan><tspan x="1208" dy="15">then the choices</tspan></text>
<text x="1208" y="126.5"><tspan x="1208" font-size="13" font-weight="700">Comments</tspan><tspan x="1208" dy="15">and rules</tspan></text>

<text x="1376" y="126.5"><tspan x="1376" font-size="13" font-weight="700">Approves</tspan><tspan x="1376" dy="15">the board</tspan></text>

<text x="2384" y="126.5"><tspan x="2384" font-size="13" font-weight="700">17 · Merge word</tspan><tspan x="2384" dy="15">and filing word</tspan></text>
<text x="2384" y="694"><tspan x="2384" font-size="13" font-weight="700">18 · Merges, files,</tspan><tspan x="2384" dy="15">wires the board,</tspan><tspan x="2384" dy="15">routes builds</tspan></text>

<figcaption style="margin-top: 14px; font-size: 15px; line-height: 1.55; color: #2B2B2B; max-width: 1900px;">Discovery never breaks the spec into issues or files anything: after your approval the advisor adds the breakdown to the same PR and vets it, and one merge word covers both. The advisor's vet never fixes the spec itself; it sends findings back to discovery and re-vets. When the vet is clean, discovery sends your final sheet, with the vet's owner calls and approval as the last card. <b>Splitting:</b> a spec covers one piece you could approve and ship on its own; if writing turns up a second piece, discovery proposes the split and you rule. Around 300–400 lines, discovery raises splitting with you; length alone never stops the work. The dashed box only happens when an unknown blocks the requirements.</figcaption>
